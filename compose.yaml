# Full stack: SQL Server + API with demo data on http://localhost:5080.
#   docker compose up -d        everything
#   docker compose up -d db     only the database, when running the API from source
# Passwords and keys below are local demo defaults; override them through the environment.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: voltdesk-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-VoltDesk_Dev_2026!}
    ports:
      - "1433:1433"
    volumes:
      - voltdesk-db:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: .
    image: voltdesk-api
    container_name: voltdesk-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__VoltDesk: "Server=db,1433;Database=VoltDesk;User Id=sa;Password=${MSSQL_SA_PASSWORD:-VoltDesk_Dev_2026!};TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-compose-demo-signing-key-change-me-0123456789}
      Database__MigrateOnStartup: "true"
      Database__SeedDemoData: ${SEED_DEMO_DATA:-true}
      OpenApi__Enabled: "true"
    ports:
      - "5080:8080"

volumes:
  voltdesk-db:
