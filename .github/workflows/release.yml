name: Release

# Push a tag such as v1.0.0 to publish the desktop app and the API image.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  desktop:
    name: Desktop app (win-x64, self-contained)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Publish a single self-contained exe
        run: >
          dotnet publish src/VoltDesk.Desktop/VoltDesk.Desktop.csproj --configuration Release
          --runtime win-x64 --self-contained -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=None --output publish/VoltDesk
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/VoltDesk/* -DestinationPath "VoltDesk-${{ github.ref_name }}-win-x64.zip"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "VoltDesk-${{ github.ref_name }}-win-x64.zip" --title "VoltDesk ${{ github.ref_name }}" --notes-file .github/release-notes.md

  api-image:
    name: API image (GitHub Container Registry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lower-case image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/voltdesk-api" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
